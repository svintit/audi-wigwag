<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>VAG Wigwag Controller</title>
  <style>
    :root {
      --bg: #0f1115; --card: #181b22; --border: #2a2f3a;
      --text: #f3f4f6; --muted: #9ca3af; --accent: #e11d48;
      --green: #10b981; --amber: #f59e0b; --blue: #3b82f6;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      margin: 0; padding: 14px; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; gap: 10px; max-width: 480px; margin-inline: auto;
    }
    h1 { font-size: 1.08rem; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .badges { display: flex; gap: 5px; align-items: center; }
    .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 999px; background: #262b36; color: var(--muted); font-weight: 700; }
    .badge.connected { background: rgba(16, 185, 129, 0.18); color: var(--green); }
    .badge.ver { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .badge.err { background: rgba(225, 29, 72, 0.25); color: #fda4af; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .profile-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: #11141b; border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px;
      font-size: 0.73rem; color: #cbd5e1;
    }
    .profile-bar button { padding: 4px 8px; font-size: 0.7rem; border-radius: 6px; background: #2a2f3a; color: #e5e7eb; }
    .indicators, .grid, .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .lamp {
      height: 36px; border-radius: 10px; background: #111318; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; color: var(--muted);
    }
    .lamp.on { background: #f8fafc; color: #090d16; box-shadow: 0 0 18px rgba(255, 255, 255, 0.55); }
    label { display: flex; flex-direction: column; gap: 3px; font-size: 0.72rem; color: var(--muted); }
    input, select {
      width: 100%; padding: 8px 9px; border-radius: 8px; border: 1px solid var(--border);
      background: #101319; color: var(--text); font-size: 0.88rem; font-weight: 600;
    }
    button { padding: 12px; border-radius: 11px; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btnConnect { background: #2563eb; color: #fff; grid-column: span 2; }
    #btnScan { background: var(--amber); color: #1f1400; }
    #btnProbe { background: #8b5cf6; color: #fff; }
    #btnStart { background: var(--green); color: #062117; }
    #btnStop { background: var(--accent); color: #fff; }
    .did-list { display: flex; flex-direction: column; gap: 6px; max-height: 175px; overflow-y: auto; }
    .did-item {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      background: #101319; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 0.72rem;
    }
    .did-btns { display: flex; gap: 4px; }
    .did-btns button { padding: 5px 8px; font-size: 0.7rem; border-radius: 6px; background: #262b36; color: #fff; }
    #log {
      background: #090b0e; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px; height: 175px; overflow-y: auto; font-family: ui-monospace, monospace;
      font-size: 0.7rem; line-height: 1.38; color: #cbd5e1; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>
    <span>VAG Wigwag</span>
    <span class="badges">
      <span id="verBadge" class="badge err">JS Cut Off</span>
      <span id="statusBadge" class="badge">Disconnected</span>
    </span>
  </h1>

  <div class="card">
    <div class="profile-bar">
      <span id="profileSummary">Car: Not scanned yet</span>
      <button id="btnReset" type="button">Reset</button>
    </div>

    <label id="moduleSelectWrap" style="display:none;">
      Target Module to Probe
      <select id="targetModule"></select>
    </label>

    <div class="indicators">
      <div id="lampLeft" class="lamp">LEFT</div>
      <div id="lampRight" class="lamp">RIGHT</div>
    </div>

    <div class="grid">
      <label>Flashes / Burst<input id="flashesPerBurst" type="number" min="1" max="10" value="3" /></label>
      <label>Loop Cycles (0=∞)<input id="loopCycles" type="number" min="0" max="999" value="5" /></label>
      <label>Flash ON (ms)<input id="flashOnMs" type="number" min="25" max="1000" step="5" value="65" /></label>
      <label>Flash OFF (ms)<input id="flashOffMs" type="number" min="25" max="1000" step="5" value="65" /></label>
      <label>Burst Break (ms)<input id="burstBreakMs" type="number" min="50" max="3000" step="10" value="280" /></label>
      <label>Pattern Mode
        <select id="patternMode">
          <option value="sync" selected>Simultaneous (Both×3)</option>
          <option value="alternate">Alternate (L×3 → R×3)</option>
        </select>
      </label>
    </div>

    <div class="btn-row">
      <button id="btnConnect">1. Connect BLE OBD-II</button>
      <button id="btnScan" disabled>2. Scan Car</button>
      <button id="btnProbe" disabled>3. Find Lights</button>
      <button id="btnStart" disabled>Start Loop</button>
      <button id="btnStop" disabled>Stop & Release</button>
    </div>

    <div id="didList" class="did-list" style="display:none;"></div>
  </div>

  <div id="log">Ready. Close Car Scanner, turn ignition ON, and tap Connect.</div>

<script>
const APP_VERSION = "v1.7";
const STORAGE_KEY = "vag_wigwag_profile_v4";

const DEFAULT_PROFILE = {
  carLabel: "Not scanned yet",
  modules: [],
  activeIdx: 0,
  leftMod: { proto: "ATSP6", cp: "", tx: "725", rx: "78F" },
  rightMod: { proto: "ATSP6", cp: "", tx: "726", rx: "790" },
  leftOn: "", leftOff: "", leftRel: "",
  rightOn: "", rightOff: "", rightRel: "",
  flashesPerBurst: 3, flashOnMs: 65, flashOffMs: 65, burstBreakMs: 280,
  loopCycles: 5, patternMode: "sync", testerPresentMs: 1500
};

let profile = loadProfile();
const BLE_SERVICES = [
  "0000fff0-0000-1000-8000-00805f9b34fb",
  "0000ffe0-0000-1000-8000-00805f9b34fb",
  "000018f0-0000-1000-8000-00805f9b34fb",
  "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
];

const ELM_NAME_PREFIXES = [
  "IOS", "Vlink", "V-LINK", "Vgate", "OBD", "ELM",
  "Veepeak", "LELink", "Carista", "KONNWEI", "Bimmer", "UNI", "Viecar"
];

let bleDevice = null, writeChar = null, notifyChar = null;
let rxBuffer = "", promptResolver = null, abortController = null, keepAliveTimer = null, isRunning = false;

const el = (id) => document.getElementById(id);
const logBox = el("log");

function log(msg) {
  const ts = new Date().toISOString().slice(11, 23);
  logBox.textContent += `\n[${ts}] ${msg}`;
  logBox.scrollTop = logBox.scrollHeight;
}

window.onerror = (msg, src, line) => log(`JS Error (L${line}): ${msg}`);
window.onunhandledrejection = (e) => log(`Promise Error: ${e.reason?.message || e.reason}`);

function loadProfile() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    return saved ? { ...DEFAULT_PROFILE, ...saved } : { ...DEFAULT_PROFILE };
  } catch { return { ...DEFAULT_PROFILE }; }
}

function saveProfile() {
  profile.flashesPerBurst = Math.max(1, parseInt(el("flashesPerBurst").value, 10) || 3);
  profile.loopCycles = Math.max(0, parseInt(el("loopCycles").value, 10) || 0);
  profile.flashOnMs = Math.max(20, parseInt(el("flashOnMs").value, 10) || 65);
  profile.flashOffMs = Math.max(20, parseInt(el("flashOffMs").value, 10) || 65);
  profile.burstBreakMs = Math.max(40, parseInt(el("burstBreakMs").value, 10) || 280);
  profile.patternMode = el("patternMode").value;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
  refreshProfileUI();
}

function refreshProfileUI() {
  el("flashesPerBurst").value = profile.flashesPerBurst;
  el("loopCycles").value = profile.loopCycles;
  el("flashOnMs").value = profile.flashOnMs;
  el("flashOffMs").value = profile.flashOffMs;
  el("burstBreakMs").value = profile.burstBreakMs;
  el("patternMode").value = profile.patternMode;

  const readyTag = profile.leftOn ? ` | ${profile.leftOn}` : " | Needs Find Lights";
  el("profileSummary").textContent = `${profile.carLabel}${readyTag}`;

  const sel = el("targetModule");
  if (profile.modules && profile.modules.length > 0) {
    el("moduleSelectWrap").style.display = "flex";
    sel.innerHTML = profile.modules.map((m, idx) =>
      `<option value="${idx}" ${idx === profile.activeIdx ? "selected" : ""}>${m.label}</option>`
    ).join("");
  } else {
    el("moduleSelectWrap").style.display = "none";
  }
}

function getSelectedModule() {
  if (profile.modules && profile.modules[profile.activeIdx]) return profile.modules[profile.activeIdx];
  return profile.rightMod || profile.leftMod;
}

function sleep(ms, signal) {
  return new Promise((resolve, reject) => {
    if (signal?.aborted) return reject(new DOMException("Aborted", "AbortError"));
    const t = setTimeout(resolve, ms);
    signal?.addEventListener("abort", () => { clearTimeout(t); reject(new DOMException("Aborted", "AbortError")); }, { once: true });
  });
}

function onBleNotify(event) {
  rxBuffer += new TextDecoder().decode(event.target.value);
  if (rxBuffer.includes(">") && promptResolver) {
    const fullReply = rxBuffer.replace(/>/g, "").trim();
    rxBuffer = "";
    const resolve = promptResolver;
    promptResolver = null;
    resolve(fullReply);
  }
}

async function sendRaw(cmd, timeoutMs = 1200) {
  if (!writeChar) throw new Error("Not connected");
  rxBuffer = "";
  const payload = new TextEncoder().encode(cmd + "\r");
  const replyPromise = new Promise((resolve, reject) => {
    promptResolver = resolve;
    setTimeout(() => {
      if (promptResolver === resolve) { promptResolver = null; reject(new Error(`Timeout: ${cmd}`)); }
    }, timeoutMs);
  });
  if (writeChar.properties.writeWithoutResponse) await writeChar.writeValueWithoutResponse(payload);
  else await writeChar.writeValue(payload);
  return replyPromise;
}

async function targetBus(mod) {
  await sendRaw(mod.proto);
  if (mod.proto === "ATSP7" && mod.cp) await sendRaw(`ATCP ${mod.cp}`);
  await sendRaw(`ATSH ${mod.tx}`);
  await sendRaw(`ATCRA ${mod.rx}`);
}

async function connectBLE() {
  try {
    if (!navigator.bluetooth) { log("Error: Open this URL in Bluefy (not Safari)."); return; }
    log("Opening filtered OBD-II picker...");
    const filters = ELM_NAME_PREFIXES.map(namePrefix => ({ namePrefix }));
    try {
      bleDevice = await navigator.bluetooth.requestDevice({ filters, optionalServices: BLE_SERVICES });
    } catch (filterErr) {
      if (filterErr.name === "NotFoundError") {
        log("No named ELM found; showing all BLE devices...");
        bleDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BLE_SERVICES });
      } else {
        throw filterErr;
      }
    }

    bleDevice.addEventListener("gattserverdisconnected", () => {
      el("statusBadge").textContent = "Disconnected";
      el("statusBadge").classList.remove("connected");
      ["btnScan", "btnProbe", "btnStart", "btnStop"].forEach(id => el(id).disabled = true);
      log("BLE disconnected.");
    });

    const server = await bleDevice.gatt.connect();
    const services = await server.getPrimaryServices();
    writeChar = null; notifyChar = null;
    for (const svc of services) {
      for (const c of await svc.getCharacteristics()) {
        if ((c.properties.notify || c.properties.indicate) && !notifyChar) notifyChar = c;
        if ((c.properties.write || c.properties.writeWithoutResponse) && !writeChar) writeChar = c;
      }
    }
    if (!writeChar || !notifyChar) throw new Error("UART characteristics not found.");

    await notifyChar.startNotifications();
    notifyChar.addEventListener("characteristicvaluechanged", onBleNotify);
    el("statusBadge").textContent = bleDevice.name || "Connected";
    el("statusBadge").classList.add("connected");

    await sendRaw("ATZ", 2000);
    await sendRaw("ATE0");
    await sendRaw("ATL0");
    await sendRaw("ATS0");
    await sendRaw("ATH1");
    el("btnScan").disabled = false;
    el("btnProbe").disabled = false;
    el("btnStart").disabled = false;
    log(`Connected to ${bleDevice.name || "Adapter"}. ${profile.leftOn ? "Saved profile loaded!" : "Tap '2. Scan Car'."}`);
  } catch (err) { log(`Connect error: ${err.message}`); }
}

function parsePartNumber(rawReply) {
  const lines = rawReply.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let hexPayload = "";
  for (let i = 0; i < lines.length; i++) {
    const idx = lines[i].indexOf("62F187");
    if (idx !== -1) hexPayload += lines[i].slice(idx + 6);
    else if (i > 0 && lines[i].length > 8) hexPayload += lines[i].slice(lines[i].startsWith("1") ? 10 : 5);
  }
  let ascii = "";
  for (let i = 0; i + 1 < hexPayload.length; i += 2) {
    const code = parseInt(hexPayload.slice(i, i + 2), 16);
    if (code >= 0x20 && code <= 0x7e) ascii += String.fromCharCode(code);
  }
  return ascii.trim();
}

async function scanCar() {
  if (isRunning) return;
  isRunning = true;
  ["btnScan", "btnProbe", "btnStart"].forEach(id => el(id).disabled = true);

  try {
    log("Scanning VAG lighting & LED modules...");
    await sendRaw("ATAT0");
    await sendRaw("ATST 19");

    const candidates = [
      { proto: "ATSP6", cp: "", tx: "725", rx: "78F", side: "L", role: "29 Left LED" },
      { proto: "ATSP6", cp: "", tx: "726", rx: "790", side: "R", role: "39 Right LED" },
      { proto: "ATSP6", cp: "", tx: "766", rx: "7D0", side: "L", role: "D6 Left LED Drv" },
      { proto: "ATSP6", cp: "", tx: "767", rx: "7D1", side: "R", role: "D7 Right LED Drv" },
      { proto: "ATSP6", cp: "", tx: "710", rx: "77A", side: "B", role: "09 BCM1 (MLB)" },
      { proto: "ATSP6", cp: "", tx: "70E", rx: "778", side: "B", role: "09 BCM (MQB)" },
      { proto: "ATSP6", cp: "", tx: "765", rx: "7CF", side: "B", role: "09 Central Elec" },
      { proto: "ATSP7", cp: "17", tx: "FC0076", rx: "17FE0076", side: "B", role: "09 BCM1 29-bit" }
    ];

    const found = [];
    for (const c of candidates) {
      await targetBus(c);
      let ping = await sendRaw("3E00");
      if (!ping || ping.includes("NO DATA")) ping = await sendRaw("3E00");
      if (ping && !ping.includes("NO DATA") && !ping.includes("ERROR") && !ping.includes("?")) {
        const pn = parsePartNumber(await sendRaw("22F187"));
        const label = `${c.role} · ${c.tx} (${pn || "OK"})`;
        found.push({ ...c, pn, label });
        log(`FOUND: ${label}`);
      }
    }

    await sendRaw("ATAT1");
    await sendRaw("ATST 19");

    if (found.length > 0) {
      profile.modules = found;
      const leftMod = found.find(m => m.side === "L");
      const rightMod = found.find(m => m.side === "R");
      const bcmMod = found.find(m => m.side === "B");

      if (leftMod || rightMod) {
        const lObj = leftMod || { proto: "ATSP6", cp: "", tx: "725", rx: "78F", label: "29 Left LED · 725" };
        const rObj = rightMod || { proto: "ATSP6", cp: "", tx: "726", rx: "790", label: "39 Right LED · 726" };
        if (!leftMod) { found.unshift(lObj); profile.modules = found; }
        profile.leftMod = lObj;
        profile.rightMod = rObj;
        profile.activeIdx = found.findIndex(m => m.tx === (rightMod ? rightMod.tx : lObj.tx));
        profile.carLabel = `Full LED (${lObj.tx}/${rObj.tx})`;
      } else {
        profile.leftMod = bcmMod;
        profile.rightMod = bcmMod;
        profile.activeIdx = 0;
        profile.carLabel = `${bcmMod.pn || bcmMod.tx}`;
      }
      saveProfile();
      log(`Target set to ${getSelectedModule().label}. Tap '3. Find Lights'!`);
    } else {
      log("No module replied. Ensure ignition is ON (gauges lit).");
    }
  } catch (err) { log(`Scan error: ${err.message}`); }
  finally {
    isRunning = false;
    ["btnScan", "btnProbe", "btnStart"].forEach(id => el(id).disabled = false);
  }
}

async function probeLights() {
  if (isRunning) return;
  isRunning = true;
  abortController = new AbortController();
  const { signal } = abortController;
  ["btnScan", "btnProbe", "btnStart"].forEach(id => el(id).disabled = true);
  el("btnStop").disabled = false;

  const listEl = el("didList");
  listEl.innerHTML = "";
  listEl.style.display = "flex";
  const mod = getSelectedModule();

  try {
    await sendRaw("ATH0");
    await targetBus(mod);
    const sess = await sendRaw("1003");
    log(`Probing routines & 2F on ${mod.tx} (${sess})... Watch lights!`);

    await sendRaw("ATAT0");
    await sendRaw("ATST 06");
    let hits = 0;

    // 1) Test parameterized VAG LED routines 0300 & 0317 (channels 01..0A with 64=100% PWM & 01=ON)
    for (const rid of ["0300", "0317"]) {
      for (let ch = 1; ch <= 10; ch++) {
        if (signal.aborted) throw new DOMException("Aborted", "AbortError");
        const chHex = ch.toString(16).toUpperCase().padStart(2, "0");
        // Try 6-byte routine: 31 01 [RID] [CH] 64 (100% duty)
        let r = await sendRaw(`3101${rid}${chHex}64`);
        let param = `${chHex}64`;
        if (r.startsWith("7F3113")) {
          // Try 5-byte routine: 31 01 [RID] [CH]
          r = await sendRaw(`3101${rid}${chHex}`);
          param = chHex;
        }
        if (r && !r.includes("NO DATA") && !r.startsWith("7F3131") && !r.startsWith("7F3113")) {
          await sendRaw(`3102${rid}${param}`).catch(() => {});
          await sendRaw(`3102${rid}`).catch(() => {});
          hits++;
          const st = r.startsWith("71") ? "LED_ACTIVE" : r;
          const tag = `${rid}_${param}`;
          log(`HIT ${tag} [31_PARAM] -> ${st}`);
          addCustomRow(tag, st, mod, {
            on: `3101${rid}${param}`,
            off: param.length === 4 ? `3101${rid}${chHex}00` : `3102${rid}${param}`,
            rel: `3102${rid}`
          });
        }
      }
    }

    // 2) Sweep remaining 2F InputOutputControl ranges (0400-14FF & FD00-FEFF)
    const ranges = [[0x0400, 0x0650], [0x1000, 0x1200], [0xFD00, 0xFE40]];
    for (const [start, end] of ranges) {
      for (let did = start; did <= end; did++) {
        if (signal.aborted) throw new DOMException("Aborted", "AbortError");
        const hex = did.toString(16).toUpperCase().padStart(4, "0");
        let res = await sendRaw(`2F${hex}0301`);
        if (res && !res.includes("NO DATA") && !res.startsWith("7F2F31") && !res.startsWith("7F2F11")) {
          let mode = "2F_5";
          if (res.startsWith("7F2F13")) {
            const r6 = await sendRaw(`2F${hex}036400`);
            if (!r6.startsWith("7F2F13")) { mode = "2F_6"; res = r6; }
            else { mode = "2F_7"; res = await sendRaw(`2F${hex}03640000`); }
          }
          await sendRaw(`2F${hex}00`).catch(() => {});
          hits++;
          const st = res.startsWith("6F") ? "ACTIVE" : res;
          log(`HIT ${hex} [${mode}] -> ${st}`);
          const cmds = mode === "2F_6"
            ? { on: `2F${hex}036400`, off: `2F${hex}030000`, rel: `2F${hex}00` }
            : mode === "2F_7"
            ? { on: `2F${hex}03640000`, off: `2F${hex}03000000`, rel: `2F${hex}00` }
            : { on: `2F${hex}0301`, off: `2F${hex}0300`, rel: `2F${hex}00` };
          addCustomRow(`${hex} (${mode})`, st, mod, cmds);
        }
      }
    }

    await sendRaw("ATAT1");
    await sendRaw("ATST 19");
    await sendRaw("1001").catch(() => {});
    await sendRaw("ATH1");
    log(`Probe done. ${hits} channel(s) found on ${mod.tx}.`);
  } catch (err) {
    log(err.name === "AbortError" ? "Probe stopped." : `Probe error: ${err.message}`);
  } finally {
    isRunning = false;
    ["btnScan", "btnProbe", "btnStart"].forEach(id => el(id).disabled = false);
    el("btnStop").disabled = true;
  }
}

function addCustomRow(label, status, mod, cmds) {
  const row = document.createElement("div");
  row.className = "did-item";
  row.innerHTML = `<span><b>${label}</b> · ${status}</span>`;
  const btns = document.createElement("div");
  btns.className = "did-btns";

  const bPulse = document.createElement("button");
  bPulse.textContent = "Pulse";
  bPulse.onclick = async () => {
    await sendRaw("ATH0");
    await targetBus(mod);
    await sendRaw("1003");
    await sendRaw(cmds.on);
    await sleep(500);
    await sendRaw(cmds.off);
    await sendRaw(cmds.rel);
    await sendRaw("1001");
    await sendRaw("ATH1");
    log(`Pulsed ${cmds.on} on ${mod.tx}`);
  };

  const bSave = document.createElement("button");
  bSave.textContent = "Use Both";
  bSave.style.background = "#10b981";
  bSave.style.color = "#062117";
  bSave.onclick = () => {
    profile.leftOn = cmds.on; profile.leftOff = cmds.off; profile.leftRel = cmds.rel;
    profile.rightOn = cmds.on; profile.rightOff = cmds.off; profile.rightRel = cmds.rel;
    saveProfile();
    log(`Saved ${cmds.on} to BOTH ${profile.leftMod.tx} & ${profile.rightMod.tx}!`);
  };

  btns.append(bPulse, bSave);
  row.appendChild(btns);
  el("didList").appendChild(row);
}

async function setSide(side, state) {
  const sameMod = (profile.leftMod.tx === profile.rightMod.tx);
  if (side === "left" || side === "both") {
    el("lampLeft").classList.toggle("on", state);
    if (profile.leftOn) {
      const res = await sendRaw(state ? profile.leftOn : profile.leftOff);
      if (res.startsWith("7F")) log(`Left NRC: ${res}`);
    }
  }
  if (side === "right" || side === "both") {
    el("lampRight").classList.toggle("on", state);
    if (profile.rightOn && (!sameMod || profile.rightOn !== profile.leftOn)) {
      if (!sameMod) await targetBus(profile.rightMod);
      const res = await sendRaw(state ? profile.rightOn : profile.rightOff);
      if (res.startsWith("7F")) log(`Right NRC: ${res}`);
      if (!sameMod) await targetBus(profile.leftMod);
    }
  }
}

async function runBurst(side, signal) {
  for (let i = 0; i < profile.flashesPerBurst; i++) {
    const t0 = performance.now();
    await setSide(side, true);
    await sleep(Math.max(5, profile.flashOnMs - (performance.now() - t0)), signal);
    const t1 = performance.now();
    await setSide(side, false);
    if (i < profile.flashesPerBurst - 1) await sleep(Math.max(5, profile.flashOffMs - (performance.now() - t1)), signal);
  }
}

async function releaseLights() {
  el("lampLeft").classList.remove("on");
  el("lampRight").classList.remove("on");
  try {
    if (profile.leftRel) await sendRaw(profile.leftRel);
    if (profile.rightRel && profile.rightRel !== profile.leftRel) {
      if (profile.leftMod.tx !== profile.rightMod.tx) await targetBus(profile.rightMod);
      await sendRaw(profile.rightRel);
    }
    await sendRaw("1001");
    log("Control returned to ECU.");
  } catch (e) { log(`Release warning: ${e.message}`); }
}

async function startWigwag() {
  if (isRunning) return;
  saveProfile();
  if (!profile.leftOn) { log("Tap '2. Scan Car' then '3. Find Lights' first."); return; }

  isRunning = true;
  abortController = new AbortController();
  const { signal } = abortController;
  ["btnScan", "btnProbe", "btnStart"].forEach(id => el(id).disabled = true);
  el("btnStop").disabled = false;

  try {
    await sendRaw("ATH0");
    await targetBus(profile.leftMod);
    await sendRaw("1003");
    if (profile.leftMod.tx !== profile.rightMod.tx) {
      await targetBus(profile.rightMod);
      await sendRaw("1003");
      await targetBus(profile.leftMod);
    }

    keepAliveTimer = setInterval(() => {
      if (isRunning) sendRaw("3E80").catch(() => {});
    }, profile.testerPresentMs);

    let cycle = 0;
    while (profile.loopCycles === 0 || cycle < profile.loopCycles) {
      cycle++;
      if (profile.patternMode === "alternate") {
        await runBurst("left", signal); await sleep(profile.burstBreakMs, signal);
        await runBurst("right", signal); await sleep(profile.burstBreakMs, signal);
      } else {
        await runBurst("both", signal); await sleep(profile.burstBreakMs, signal);
        await runBurst("both", signal); await sleep(profile.burstBreakMs, signal);
      }
    }
    log(`Completed ${cycle} cycle(s).`);
  } catch (err) {
    log(err.name !== "AbortError" ? `Stopped: ${err.message}` : "Stopped by user.");
  } finally {
    clearInterval(keepAliveTimer); keepAliveTimer = null;
    await releaseLights();
    await sendRaw("ATH1").catch(() => {});
    isRunning = false;
    ["btnScan", "btnProbe", "btnStart"].forEach(id => el(id).disabled = false);
    el("btnStop").disabled = true;
  }
}

refreshProfileUI();
el("targetModule").addEventListener("change", (e) => {
  profile.activeIdx = parseInt(e.target.value, 10) || 0;
  saveProfile();
});
el("btnConnect").addEventListener("click", connectBLE);
el("btnScan").addEventListener("click", scanCar);
el("btnProbe").addEventListener("click", probeLights);
el("btnStart").addEventListener("click", startWigwag);
el("btnStop").addEventListener("click", () => abortController?.abort());
el("btnReset").addEventListener("click", () => {
  localStorage.removeItem(STORAGE_KEY);
  profile = loadProfile();
  refreshProfileUI();
  el("didList").style.display = "none";
  log("Saved device profile cleared.");
});

el("verBadge").textContent = APP_VERSION;
el("verBadge").className = "badge ver";
</script>
</body>
